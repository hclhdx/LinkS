<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二次元番剧库 | 结城明日奈 · 疾旋鼬 · 哥伦比亚 · 桑多涅 · 芙宁娜 · 利姆露</title>
<meta name="description" content="二次元番剧库：介绍结城明日奈、疾旋鼬、哥伦比亚、桑多涅、芙宁娜、利姆露等核心角色，视频与图片优先来自哔哩哔哩。">
<style>
/* SECTION: reset-vars */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0}
:root{
  --bg:#ffffff;--bg-soft:#f7f8fa;--bg-deep:#101218;
  --ink:#14161c;--ink-2:#4a5060;--ink-3:#8a90a0;
  --line:#e6e8ee;--line-2:#f0f1f5;
  --brand:#5b6cff;--brand-2:#8b5cf6;--brand-soft:#eef0ff;
  --r-lg:20px;--r-md:14px;--r-sm:8px;
  --shadow-1:0 1px 2px rgba(20,22,28,.04),0 4px 16px rgba(20,22,28,.05);
  --shadow-2:0 8px 28px rgba(20,22,28,.10),0 2px 6px rgba(20,22,28,.05);
  --nav-h:72px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
body{font-family:var(--font);color:var(--ink);background:var(--bg);
  line-height:1.7;font-size:15px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.35;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.wrap{width:min(1240px,100% - 64px);margin-inline:auto}
.eyebrow{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.eyebrow b{font-size:clamp(26px,3.2vw,38px);font-weight:800;letter-spacing:-.02em}
.eyebrow span{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
section{position:relative}
.sec-pad{padding:clamp(72px,9vw,132px) 0}

/* SECTION: nav */
.nav{position:fixed;inset:0 0 auto;z-index:900;height:var(--nav-h);
  display:flex;align-items:center;transition:background .35s,box-shadow .35s,backdrop-filter .35s}
.nav-in{width:min(1240px,100% - 40px);margin-inline:auto;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;
  font-size:17px;color:#fff;transition:color .35s;flex:0 0 auto}
.logo i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-style:normal;
  font-size:12px;font-weight:800;flex:0 0 auto}
.nav-links{display:flex;gap:4px;flex:1 1 auto}
.nav-links a{position:relative;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;
  color:rgba(255,255,255,.82);transition:color .25s,background .25s;white-space:nowrap}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.14)}
.nav-links a.on{color:#fff;background:rgba(255,255,255,.18)}
.nav-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.lang{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:13px;
  color:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.22);transition:.25s}
.lang:hover{background:rgba(255,255,255,.14);color:#fff}
.lang svg{width:12px;height:12px;flex:0 0 auto}
.nav-cta{padding:9px 20px;border-radius:999px;font-size:13.5px;font-weight:600;color:#fff;
  background:linear-gradient(120deg,var(--brand),var(--brand-2));
  box-shadow:0 4px 14px rgba(91,108,255,.32);transition:transform .25s,box-shadow .25s}
.nav-cta:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(91,108,255,.42)}
.burger{display:none;width:40px;height:40px;border-radius:11px;place-items:center;
  border:1px solid rgba(255,255,255,.24);color:#fff;transition:.25s}
.burger svg{width:18px;height:18px}
/* 滚过首屏后：白底深字 */
.nav.solid{background:rgba(255,255,255,.86);backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);box-shadow:0 1px 0 var(--line),0 6px 24px rgba(20,22,28,.06)}
.nav.solid .logo,.nav.solid .burger{color:var(--ink)}
.nav.solid .burger{border-color:var(--line)}
.nav.solid .nav-links a{color:var(--ink-2)}
.nav.solid .nav-links a:hover{color:var(--ink);background:var(--bg-soft)}
.nav.solid .nav-links a.on{color:var(--brand);background:var(--brand-soft)}
.nav.solid .lang{color:var(--ink-2);border-color:var(--line)}
.nav.solid .lang:hover{background:var(--bg-soft);color:var(--ink)}
/* 移动抽屉 */
.m-drawer{position:fixed;inset:0;z-index:899;background:rgba(255,255,255,.98);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:calc(var(--nav-h) + 24px) 24px 32px;display:flex;flex-direction:column;gap:4px;
  transform:translateX(100%);transition:transform .38s cubic-bezier(.4,0,.2,1);visibility:hidden}
.m-drawer.open{transform:translateX(0);visibility:visible}
.m-drawer a{padding:15px 6px;border-bottom:1px solid var(--line-2);font-size:17px;font-weight:600;color:var(--ink)}
.m-drawer .m-cta{margin-top:20px;text-align:center;padding:15px;border-radius:var(--r-md);
  background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff;border:0}
.m-drawer .m-lang{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.m-drawer .m-lang span{padding:7px 14px;border-radius:999px;background:var(--bg-soft);
  font-size:13px;color:var(--ink-2);border:1px solid var(--line)}
.m-drawer .m-lang span.cur{background:var(--brand-soft);color:var(--brand);border-color:transparent;font-weight:600}

/* SECTION: hero */
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;background:#0b0d12}
.h-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease}
.h-slide.on{opacity:1;visibility:visible}
.h-media{position:absolute;inset:0}
.h-media img,.h-media video{width:100%;height:100%;object-fit:cover}
.h-media::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(8,10,16,.82) 0%,rgba(8,10,16,.52) 38%,rgba(8,10,16,.12) 68%,rgba(8,10,16,.34) 100%),
             linear-gradient(0deg,rgba(8,10,16,.72) 0%,rgba(8,10,16,0) 42%)}
.h-slide.on .h-media img,.h-slide.on .h-media video{animation:hZoom 9s ease-out forwards}
@keyframes hZoom{from{transform:scale(1.06)}to{transform:scale(1)}}
.h-body{position:absolute;inset:auto 0 0;padding:0 0 clamp(88px,12vh,132px);z-index:3}
.h-in{width:min(1240px,100% - 64px);margin-inline:auto}
.h-play{display:inline-flex;align-items:center;gap:8px;padding:7px 15px 7px 11px;border-radius:999px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12.5px;
  letter-spacing:.08em;margin-bottom:20px;backdrop-filter:blur(8px);transition:.25s}
.h-play:hover{background:rgba(255,255,255,.26)}
.h-play i{width:19px;height:19px;border-radius:50%;background:#fff;color:#14161c;display:grid;place-items:center;font-style:normal}
.h-play svg{width:8px;height:8px}
.h-tag{display:inline-block;padding:5px 13px;border-radius:999px;font-size:12.5px;letter-spacing:.06em;
  background:linear-gradient(120deg,rgba(91,108,255,.9),rgba(139,92,246,.9));color:#fff;margin-bottom:16px;font-weight:600}
.h-name{color:#fff;font-size:clamp(38px,6.6vw,76px);font-weight:800;letter-spacing:-.025em;line-height:1.1}
.h-en{color:rgba(255,255,255,.6);font-size:clamp(11px,1.2vw,14px);letter-spacing:.3em;
  text-transform:uppercase;margin-top:10px;font-weight:600}
.h-desc{color:rgba(255,255,255,.84);font-size:clamp(14px,1.35vw,16.5px);margin-top:22px;
  max-width:560px;line-height:1.85;white-space:pre-line}
.h-row{display:flex;align-items:center;gap:22px;margin-top:32px;flex-wrap:wrap}
.h-link{display:inline-flex;align-items:center;gap:10px;padding:13px 32px;border-radius:999px;
  background:#fff;color:#14161c;font-size:14.5px;font-weight:700;letter-spacing:.02em;
  transition:transform .28s,box-shadow .28s}
.h-link:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.34)}
.h-link svg{width:14px;height:14px}
.h-social{display:flex;align-items:center;gap:6px}
.h-social a{padding:7px 13px;border-radius:999px;font-size:12.5px;color:rgba(255,255,255,.76);
  border:1px solid rgba(255,255,255,.24);transition:.25s;white-space:nowrap}
.h-social a:hover{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4)}
/* 轮播控件 */
.h-rail{position:absolute;right:clamp(20px,3vw,40px);top:50%;transform:translateY(-50%);z-index:5;
  display:flex;flex-direction:column;gap:12px}
.h-dot{width:3px;height:26px;border-radius:3px;background:rgba(255,255,255,.3);transition:.35s;position:relative}
.h-dot:hover{background:rgba(255,255,255,.55)}
.h-dot.on{background:rgba(255,255,255,.28);height:44px}
.h-dot.on::after{content:'';position:absolute;inset:0;border-radius:3px;background:#fff;
  transform-origin:top;animation:railFill var(--dur,6s) linear forwards}
@keyframes railFill{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.h-nav{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:5;
  display:flex;justify-content:space-between;padding:0 clamp(12px,2.2vw,28px);pointer-events:none}
.h-nav button{pointer-events:auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.24);color:#fff;
  backdrop-filter:blur(8px);transition:.28s;opacity:.55}
.h-nav button:hover{background:rgba(255,255,255,.24);opacity:1;transform:scale(1.06)}
.h-nav svg{width:19px;height:19px}
.h-scroll{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:7px;color:rgba(255,255,255,.62);font-size:10.5px;letter-spacing:.2em}
.h-scroll i{width:1px;height:34px;background:linear-gradient(180deg,rgba(255,255,255,.7),transparent);
  animation:scrollHint 2.1s ease-in-out infinite}
@keyframes scrollHint{0%,100%{transform:scaleY(.35);opacity:.4}50%{transform:scaleY(1);opacity:1}}
/* SECTION: reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .75s cubic-bezier(.22,.61,.36,1),transform .75s cubic-bezier(.22,.61,.36,1)}
.rv.in{opacity:1;transform:none}
.rv-d1{transition-delay:.09s}.rv-d2{transition-delay:.18s}.rv-d3{transition-delay:.27s}.rv-d4{transition-delay:.36s}

/* SECTION: vision */
.vision{background:var(--bg-deep);color:#fff;text-align:center;overflow:hidden}
.vision::before{content:'';position:absolute;inset:0;
  background:radial-gradient(680px 380px at 50% 108%,rgba(91,108,255,.26),transparent 70%)}
.vision .wrap{position:relative;z-index:2}
.vision .eyebrow{align-items:center}
.vision .eyebrow span{color:rgba(255,255,255,.42)}
.v-lines{font-size:clamp(23px,3.4vw,44px);font-weight:700;line-height:1.62;letter-spacing:-.015em;
  white-space:pre-line;margin-top:6px}
.v-lines em{font-style:normal;background:linear-gradient(120deg,#98a4ff,#d0a4ff);
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* SECTION: about */
.about{background:var(--bg)}
.ab-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:clamp(36px,5vw,76px);align-items:center}
.ab-text p{color:var(--ink-2);margin-bottom:16px;font-size:15.5px}
.ab-text p:last-child{margin-bottom:0}
.ab-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:36px}
.fact{padding:20px 12px;border-radius:var(--r-md);background:var(--bg-soft);border:1px solid var(--line-2);
  text-align:center;transition:transform .3s,box-shadow .3s,background .3s}
.fact:hover{transform:translateY(-4px);box-shadow:var(--shadow-1);background:#fff}
.fact b{display:block;font-size:clamp(24px,2.9vw,34px);font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(120deg,var(--brand),var(--brand-2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.fact span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:5px}
.ab-img{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:4/3.35;box-shadow:var(--shadow-2)}
.ab-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.22,.61,.36,1)}
.ab-img:hover img{transform:scale(1.05)}
.ab-img::after{content:'';position:absolute;inset:0;
  background:linear-gradient(150deg,rgba(91,108,255,.14),transparent 58%);pointer-events:none}

/* SECTION: credo */
.credo{background:var(--bg-soft)}
.credo-list{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:8px}
.credo-card{position:relative;padding:36px 30px;border-radius:var(--r-lg);background:#fff;
  border:1px solid var(--line-2);overflow:hidden;transition:transform .38s,box-shadow .38s}
.credo-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));transform:scaleY(0);
  transform-origin:top;transition:transform .42s cubic-bezier(.22,.61,.36,1)}
.credo-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-2)}
.credo-card:hover::before{transform:scaleY(1)}
.credo-card em{display:block;font-style:normal;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brand);font-weight:700;margin-bottom:14px}
.credo-card h3{font-size:21px;margin-bottom:12px}
.credo-card p{color:var(--ink-2);font-size:14.5px}

/* SECTION: careers */
.careers{background:var(--bg)}
.ca-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:8px}
.ca-card{position:relative;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/8.4;
  display:flex;align-items:flex-end;box-shadow:var(--shadow-1);transition:transform .4s,box-shadow .4s}
.ca-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-2)}
.ca-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform 1.15s cubic-bezier(.22,.61,.36,1)}
.ca-card:hover img{transform:scale(1.07)}
.ca-card::after{content:'';position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(10,12,18,.84) 0%,rgba(10,12,18,.3) 46%,rgba(10,12,18,.06) 100%)}
.ca-body{position:relative;z-index:2;padding:clamp(22px,2.6vw,34px);color:#fff;width:100%}
.ca-body h3{font-size:clamp(21px,2.3vw,27px);color:#fff;margin-bottom:8px}
.ca-body p{color:rgba(255,255,255,.8);font-size:14px;max-width:430px;margin-bottom:18px}
.ca-more{display:inline-flex;align-items:center;gap:9px;font-size:11.5px;letter-spacing:.18em;
  text-transform:uppercase;font-weight:700;padding:10px 20px;border-radius:999px;
  border:1px solid rgba(255,255,255,.4);transition:.28s}
.ca-more:hover{background:#fff;color:#14161c;border-color:#fff}
.ca-more svg{width:13px;height:13px}

/* SECTION: history (深色) */
.history{background:var(--bg-deep);color:#fff;overflow:hidden}
.history::before{content:'';position:absolute;inset:0;
  background:radial-gradient(760px 420px at 88% 0%,rgba(139,92,246,.2),transparent 68%),
             radial-gradient(620px 380px at 4% 96%,rgba(91,108,255,.16),transparent 70%)}
.history .wrap{position:relative;z-index:2}
.history .eyebrow span{color:rgba(255,255,255,.42)}
.hs-slogan{font-size:clamp(26px,4vw,50px);font-weight:800;letter-spacing:-.02em;margin-bottom:52px;
  background:linear-gradient(120deg,#fff 22%,#a9b3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hs-pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pillar{padding:30px 26px;border-radius:var(--r-lg);background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);transition:transform .38s,background .38s,border-color .38s}
.pillar:hover{transform:translateY(-6px);background:rgba(255,255,255,.085);border-color:rgba(255,255,255,.2)}
.pillar h3{font-size:18.5px;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.pillar h3 i{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#8b96ff,#c4a4ff);flex:0 0 auto}
.pillar li{color:rgba(255,255,255,.66);font-size:14px;padding-left:16px;position:relative;margin-bottom:10px;line-height:1.75}
.pillar li::before{content:'';position:absolute;left:0;top:11px;width:5px;height:1px;background:rgba(255,255,255,.36)}
.pillar li:last-child{margin-bottom:0}
.hs-timeline{margin-top:clamp(52px,7vw,88px);position:relative;padding-top:34px}
.hs-timeline::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22) 12%,rgba(255,255,255,.22) 88%,transparent)}
.tl-track{display:flex;gap:16px;overflow-x:auto;padding-bottom:16px;scroll-snap-type:x mandatory;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.24) transparent}
.tl-track::-webkit-scrollbar{height:4px}
.tl-track::-webkit-scrollbar-thumb{background:rgba(255,255,255,.24);border-radius:4px}
.tl-item{flex:0 0 clamp(190px,21vw,248px);scroll-snap-align:start;padding-top:24px;position:relative}
.tl-item::before{content:'';position:absolute;top:-4.5px;left:0;width:9px;height:9px;border-radius:50%;
  background:var(--bg-deep);border:2px solid rgba(255,255,255,.4);transition:.3s}
.tl-item:hover::before{border-color:#a9b3ff;box-shadow:0 0 0 4px rgba(139,92,246,.2)}
.tl-item b{display:block;font-size:25px;font-weight:800;color:#fff;letter-spacing:-.01em}
.tl-item span{display:block;font-size:13.5px;color:rgba(255,255,255,.56);margin-top:7px;line-height:1.7}

/* SECTION: values */
.values{background:var(--bg)}
.v-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.v-card{position:relative;padding:38px 24px;border-radius:var(--r-lg);text-align:center;overflow:hidden;
  background:var(--bg-soft);border:1px solid var(--line-2);transition:transform .38s,box-shadow .38s}
.v-card::after{content:'';position:absolute;inset:0;opacity:0;transition:opacity .4s;
  background:linear-gradient(140deg,rgba(91,108,255,.1),rgba(139,92,246,.1))}
.v-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-2)}
.v-card:hover::after{opacity:1}
.v-card b{position:relative;z-index:2;display:block;font-size:22px;font-weight:800;letter-spacing:.02em}
.v-card span{position:relative;z-index:2;display:block;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);margin-top:11px;font-weight:600}

/* SECTION: benefits */
.benefits{background:var(--bg-soft)}
.bf-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.bf-card{padding:32px 30px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line-2);
  transition:transform .38s,box-shadow .38s}
.bf-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-2)}
.bf-card h3{font-size:19px;margin-bottom:6px}
.bf-card>span{display:block;font-size:12.5px;color:var(--brand);margin-bottom:18px;font-weight:600}
.bf-card li{color:var(--ink-2);font-size:14px;padding-left:18px;position:relative;margin-bottom:9px}
.bf-card li::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.bf-card li:last-child{margin-bottom:0}

/* SECTION: news */
.news{background:var(--bg)}
.ns-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:36px}
.ns-list{display:flex;flex-direction:column;gap:16px}
.ns-item{display:grid;grid-template-columns:112px 232px 1fr;gap:28px;align-items:center;
  padding:20px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);
  transition:transform .35s,box-shadow .35s,border-color .35s}
.ns-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:transparent}
.ns-date{text-align:center;flex:0 0 auto}

/* ---------- SECTION: state ---------- */
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { S = deep(DEF); merge(S, JSON.parse(raw)); return; }
  } catch (e) { /* 本地存储不可用时静默回落默认值 */ }
  S = deep(DEF);
}
function merge(t, s) {
  if (!s || typeof s !== 'object') return;
  Object.keys(s).forEach(function (k) {
    if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) merge(t[k], s[k]);
    else t[k] = s[k];
  });
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('当前浏览器禁止本地存储，改动仅在导出后生效'); } }
function reset() {
  try { localStorage.removeItem(KEY); } catch (e) {}
  S = deep(DEF); renderAll(); if (edOpen) buildEditor(edTab);
  toast('已恢复默认内容');
}

var toastEl = null, toastT = null;
function toast(msg) {
  if (!toastEl) toastEl = $('#edToast');
  if (!toastEl) return;
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
}

/* ---------- SECTION: hero-carousel ---------- */
var hIdx = 0, hTimer = null, hPaused = false;
function slideMedia(sl) {
  var v = sl.video || '';
  if (v && /youtu|bilibili|b23\.tv/i.test(v)) {
    var src = '';
    var bv = v.match(/(BV[0-9A-Za-z]{8,12})/);
    var av = v.match(/[?&/]av(\d{4,})/i);
    var yt = v.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{8,})/);
    if (bv) src = '//player.bilibili.com/player.html?bvid=' + bv[1] + '&autoplay=0&danmaku=0&high_quality=1';
    else if (av) src = '//player.bilibili.com/player.html?aid=' + av[1] + '&autoplay=0&danmaku=0&high_quality=1';
    else if (yt) src = '//www.youtube-nocookie.com/embed/' + yt[1] + '?rel=0';
    if (src) return '<iframe src="' + esc(src) + '" title="' + esc(sl.name) + '" allowfullscreen loading="lazy" style="width:100%;height:100%;border:0"></iframe>';
  }
  if (v && /\.(mp4|webm|ogg|m4v)(\?|#|$)/i.test(v)) {
    return '<video src="' + esc(v) + '" muted loop playsinline preload="none"' + (sl.image ? ' poster="' + esc(sl.image) + '"' : '') + '></video>';
  }
  return sl.image ? '<img src="' + esc(sl.image) + '" alt="' + esc(sl.name) + '" loading="lazy">' : '';
}
function renderHero() {
  var h = S.hero || {}, sl = h.slides || [];
  $('#hSlides').innerHTML = sl.map(function (s, i) {
    return '<div class="h-slide' + (i === 0 ? ' on' : '') + '" data-i="' + i + '"><div class="h-media">' + slideMedia(s) + '</div></div>';
  }).join('') || '<div class="h-slide on"><div class="h-media"></div></div>';

  var dur = Number(h.autoplayMs) || 6000;
  $('#hRail').innerHTML = sl.map(function (s, i) {
    return '<button class="h-dot' + (i === 0 ? ' on' : '') + '" type="button" data-i="' + i + '" style="--dur:' + dur + 'ms" aria-label="第' + (i + 1) + '张"></button>';
  }).join('');
  $$('#hRail .h-dot').forEach(function (d) {
    d.addEventListener('click', function () { go(+d.dataset.i); });
  });

  /* 编辑过程中保持当前帧，避免每敲一个字就跳回第一帧 */
  var sl2 = (S.hero && S.hero.slides) || [];
  if (hIdx >= sl2.length) hIdx = 0;
  $$('.h-slide').forEach(function (e, i) { e.classList.toggle('on', i === hIdx); });
  paintHero();
  if (!hPaused) startAuto();
}
function paintHero() {
  var sl = (S.hero && S.hero.slides) || [];
  var s = sl[hIdx]; if (!s) { $('#hBody').innerHTML = ''; return; }
  var soc = (s.socials || []).map(function (x) {
    return '<a href="' + esc(x.url || '#') + '">' + esc(x.label) + '</a>';
  }).join('');
  $('#hBody').innerHTML =
    '<button class="h-play" type="button" id="hPlay"><i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></i>播放视频</button>' +
    (s.tagline ? '<div class="h-tag">' + esc(s.tagline) + '</div>' : '') +
    '<h1 class="h-name">' + esc(s.name) + '</h1>' +
    (s.enName ? '<div class="h-en">' + esc(s.enName) + '</div>' : '') +
    (s.desc ? '<p class="h-desc">' + esc(s.desc) + '</p>' : '') +
    '<div class="h-row">' +
      (s.linkText ? '<a class="h-link" href="' + esc(s.linkUrl || '#') + '">' + esc(s.linkText) +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>' : '') +
      (soc ? '<div class="h-social">' + soc + '</div>' : '') +
    '</div>';
  var pb = $('#hPlay');
  if (pb) pb.addEventListener('click', function () {
    var cur = $$('.h-slide')[hIdx]; if (!cur) return;
    var v = cur.querySelector('video');
    if (v) { v.muted = false; v.play(); toast('正在播放背景视频'); return; }
    var f = cur.querySelector('iframe');
    if (f) { f.src = f.src.replace('autoplay=0', 'autoplay=1'); toast('正在加载视频'); return; }
    toast('当前帧未设置视频，可在编辑面板中填入视频地址');
  });
  $$('#hRail .h-dot').forEach(function (d, i) { d.classList.toggle('on', i === hIdx); });
}
function go(i) {
  var sl = (S.hero && S.hero.slides) || [];
  if (!sl.length) return;
  hIdx = (i + sl.length) % sl.length;
  $$('.h-slide').forEach(function (e, k) {
    e.classList.toggle('on', k === hIdx);
    var v = e.querySelector('video');
    if (v) { if (k === hIdx) { v.currentTime = 0; v.play().catch(function () {}); } else v.pause(); }
  });
  paintHero(); startAuto();
}
function startAuto() {
  clearInterval(hTimer);
  var dur = Number((S.hero || {}).autoplayMs) || 6000;
  if (dur < 1000 || hPaused) return;
  hTimer = setInterval(function () { if (!hPaused && !edOpen) go(hIdx + 1); }, dur);
}

var factDone = {};
function countUp(el, target) {
  var t0 = null, D = 1500;
  function step(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / D, 1);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString('en-US');
    if (p < 1) requestAnimationFrame(step);
    else if (el.dataset.k) factDone[el.dataset.k] = 1;
  }
  requestAnimationFrame(step);
}
function renderAbout() {
  var a = S.about || {};
  $('#abZh').textContent = a.eyebrow || '';
  $('#abEn').textContent = a.eyebrowEn || '';

  $('#abFacts').innerHTML = (a.facts || []).map(function (f, i) {
    var n = Number(f.num) || 0;
    var shown = factDone['f' + i] ? n.toLocaleString('en-US') : '0';

/* ---------- SECTION: news-pager ---------- */
var nPage = 1;
function renderNews() {
  var n = S.news || {}, all = n.items || [];
  $('#nsZh').textContent = n.eyebrow || '';
  $('#nsEn').textContent = n.eyebrowEn || '';
  var more = $('#nsMore');
  more.textContent = n.moreText || '查看更多新闻';
  more.insertAdjacentHTML('beforeend', ARROW);
  more.setAttribute('href', n.moreUrl || '#');

  var per = Math.max(1, Number(n.perPage) || 3);
  var pages = Math.max(1, Math.ceil(all.length / per));
  if (nPage > pages) nPage = pages;
  var slice = all.slice((nPage - 1) * per, nPage * per);

  $('#nsList').innerHTML = slice.length ? slice.map(function (it) {
    return '<a class="ns-item" href="' + esc(it.linkUrl || '#') + '">' +
      '<div class="ns-date"><b>' + esc(it.mmdd || '') + '</b><span>' + esc(it.year || '') + '</span></div>' +
      '<div class="ns-thumb">' + (it.image ? '<img src="' + esc(it.image) + '" alt="' + esc(it.title) + '" loading="lazy">' : '') + '</div>' +
      '<div class="ns-body">' + (it.cat ? '<span class="ns-cat">' + esc(it.cat) + '</span>' : '') +
      '<h3>' + esc(it.title) + '</h3><p>' + esc(it.excerpt) + '</p></div></a>';
  }).join('') : '<div class="empty-note">暂无新闻，可在编辑面板中添加</div>';

  var pg = $('#nsPager');
  if (pages <= 1) { pg.innerHTML = all.length ? '<span class="pg-info">共 ' + all.length + ' 条</span>' : ''; return; }
  var html = '<button type="button" data-p="' + (nPage - 1) + '"' + (nPage === 1 ? ' disabled' : '') + '>上一页</button>';
  for (var i = 1; i <= pages; i++) html += '<button type="button" class="' + (i === nPage ? 'on' : '') + '" data-p="' + i + '">' + i + '</button>';
  html += '<span class="pg-info">' + nPage + ' / ' + pages + '</span>';
  html += '<button type="button" data-p="' + (nPage + 1) + '"' + (nPage === pages ? ' disabled' : '') + '>下一页</button>';
  pg.innerHTML = html;
  $$('button[data-p]', pg).forEach(function (b) {
    b.addEventListener('click', function () {
      var p = +b.dataset.p;
      if (p < 1 || p > pages || p === nPage) return;
      nPage = p; renderNews();
      var top = $('#news').getBoundingClientRect().top + window.pageYOffset - 80;
      window.scrollTo({ top: top, behavior: 'smooth' });
    });
  });
}

/* ---------- SECTION: reveal / scrollspy ---------- */
var io = null;
function observeReveal() {
  if (!('IntersectionObserver' in window)) { $$('.rv').forEach(function (e) { e.classList.add('in'); }); return; }
  if (io) io.disconnect();
  io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      e.target.classList.add('in');
      io.unobserve(e.target);
      $$('b[data-n]', e.target).forEach(function (b) {
        if (b.dataset.done) return;
        if (b.dataset.k && factDone[b.dataset.k]) { b.dataset.done = '1'; return; }
        b.dataset.done = '1'; countUp(b, +b.dataset.n || 0);
      });
    });
  }, { threshold: .16, rootMargin: '0px 0px -8% 0px' });
  $$('.rv').forEach(function (e) { io.observe(e); });
}
function scrollFx() {
  var y = window.pageYOffset;
  var nav = $('#nav');
  if (nav) nav.classList.toggle('solid', y > window.innerHeight * .82);
  var tt = $('#toTop');
  if (tt) tt.classList.toggle('show', y > window.innerHeight * .7);
  /* 导航高亮 */
  var cur = '';
  $$('main section[id],header[id]').forEach(function (sec) {
    if (sec.getBoundingClientRect().top <= 140) cur = sec.id;
  });
  $$('#navLinks a').forEach(function (a) {
    a.classList.toggle('on', a.dataset.anc === '#' + cur);
  });
}

/* ---------- SECTION: export ---------- */
function exportFile() {
  /* 导出文件一律内联当前内容，不依赖外部数据脚本 */
  var dataSrcText = 'window.__SITE_DEFAULT__=' + JSON.stringify(S) + ';\nwindow.__IMAGE_LIBRARY__=' + JSON.stringify(LIB) + ';';
  var baked = 'window.__BAKED__=' + JSON.stringify(S) + ';';
  var out = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
    '<title>' + esc((S.meta && S.meta.title) || '官网模板') + '</title>\n' +
    '<style>\n' + STYLE_MARKUP + '\n</style>\n</head>\n<body id="top">\n' +
    BODY_MARKUP +
    '\n<script>\n' + dataSrcText + '\n<\/script>\n<script>\n' + baked + '\n<\/script>\n<script>\n' + APP_SRC + '\n<\/script>\n</body>\n</html>';
  var blob = new Blob([out], { type: 'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  toast('已导出 index.html，可直接上传托管');
}

/* ---------- SECTION: wire ---------- */
function boot() {
  drawer = $('#mDrawer'); burger = $('#burger');
  /* 导出文件中优先使用烘焙数据 */
  if (window.__BAKED__) { S = deep(window.__BAKED__); } else { load(); }
  renderAll();

  if (burger) burger.addEventListener('click', function () {
    (drawer && drawer.classList.contains('open')) ? closeDrawer() : openDrawer();
  });
  var prev = $('#hPrev'), next = $('#hNext');
  if (prev) prev.addEventListener('click', function () { go(hIdx - 1); });
  if (next) next.addEventListener('click', function () { go(hIdx + 1); });

  var hero = $('#hero');
  if (hero) {
    hero.addEventListener('mouseenter', function () { hPaused = true; });
    hero.addEventListener('mouseleave', function () { hPaused = false; startAuto(); });
    hero.addEventListener('touchstart', function () { hPaused = true; }, { passive: true });
    var tx = null;
    hero.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
    hero.addEventListener('touchend', function (e) {
      if (tx == null) return;
      var dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 46) go(dx < 0 ? hIdx + 1 : hIdx - 1);
      tx = null; hPaused = false; startAuto();
    });
  }
  document.addEventListener('keydown', function (e) {
    if (edOpen) return;
    if (e.key === 'ArrowRight') go(hIdx + 1);
    if (e.key === 'ArrowLeft') go(hIdx - 1);
  });
  document.addEventListener('visibilitychange', function () {
    hPaused = document.hidden; if (!document.hidden) startAuto();
  });

  window.addEventListener('scroll', function () { requestAnimationFrame(scrollFx); }, { passive: true });
  scrollFx();
  var tt = $('#toTop');
  if (tt) tt.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  var fab = $('#edFab');
  if (fab) fab.addEventListener('click', function () { openEditor(); });
  var xc = $('#edClose'), mk = $('#edMask');
  if (xc) xc.addEventListener('click', closeEditor);
  if (mk) mk.addEventListener('click', closeEditor);
  var sv = $('#edSave'), rs = $('#edReset'), ex = $('#edExport');
  if (sv) sv.addEventListener('click', function () { persist(); toast('已保存到当前浏览器'); });
  if (rs) rs.addEventListener('click', reset);
  if (ex) ex.addEventListener('click', exportFile);

function buildEditor(tab) {
  edTab = tab;
  $('#edTabs').innerHTML = ED_TABS.map(function (t) {
    return '<button type="button" class="' + (t.key === tab ? 'on' : '') + '" data-tab="' + t.key + '">' + esc(t.label) + '</button>';
  }).join('');
  $$('#edTabs button').forEach(function (b) {
    b.addEventListener('click', function () { buildEditor(b.dataset.tab); $('#edBody').scrollTop = 0; });
  });
  var body = $('#edBody');
  var prevScroll = body.scrollTop;
  body.innerHTML = (TAB_FN[tab] || tabBrand)();
  /* 先按卡片标题赋 key，再恢复展开状态；用标题而非序号，避免增删后错位 */
  $$('.grp', body).forEach(function (g, i) {
    var b = $('.grp-h b', g);
    g.dataset.key = tab + ':' + ((b && b.textContent.trim()) || ('idx' + i));
  });
  wireEditor(body);
  $$('.grp', body).forEach(function (g) { if (edView[g.dataset.key]) g.classList.add('open'); });
  body.scrollTop = prevScroll;
}

/* ---------- SECTION: editor-wire ---------- */
function wireEditor(body) {
  /* 分组展开 */
  $$('.grp-h', body).forEach(function (h) {
    h.addEventListener('click', function (e) {
      if (e.target.closest('.grp-tools')) return;
      var g = h.parentNode;
      g.classList.toggle('open');
      if (g.classList.contains('open')) edView[g.dataset.key] = 1; else delete edView[g.dataset.key];
    });
  });
  /* 文本改动：即时渲染（输入框不重建，避免打断输入） */
  /* 排除图片槽位内的输入框，它们由下方专用处理器接管，避免重复渲染 */
  $$('input[type=text],textarea', body).forEach(function (el) {
    if (el.closest('.imgslot')) return;
    el.addEventListener('input', function () {
      set(el.dataset.p, el.value);
      renderAll();
      /* 仅更新卡片标题，不重建面板，保住光标 */
      var g = el.closest('.grp');
      if (g && g.classList.contains('open')) {
        var b = $('.grp-h b', g);
        if (b && /name|title|zh|label/.test(el.dataset.p)) {
          var nv = el.value || b.textContent;
          if (nv) b.textContent = String(nv).slice(0, 22);
        }
      }
      persist();
    });
  });
  /* 图片槽位内的输入框单独处理：改完刷新预览 */
  $$('.imgslot input[type=text]', body).forEach(function (el) {
    el.addEventListener('input', function () {
      set(el.dataset.p, el.value); renderAll(); persist();
      var pv = $('.prev', el.closest('.imgslot'));
      if (pv) pv.innerHTML = el.value
        ? '<img src="' + esc(el.value) + '" alt="预览" loading="lazy">'
        : '<span class="none">未设置</span>';
    });
  });
  /* 槽位按钮：上传 / 图库 / 清除 */
  $$('.imgslot', body).forEach(function (slot) {
    var path = slot.dataset.slot;
    $$('[data-act]', slot).forEach(function (b) {
      var act = b.dataset.act;
      if (act === 'up') b.addEventListener('click', function () { pickFile(path, slot); });
      if (act === 'clear') b.addEventListener('click', function () {
        set(path, ''); var inp = $('input[type=text]', slot); if (inp) inp.value = '';
        var pv = $('.prev', slot); if (pv) pv.innerHTML = '<span class="none">未设置</span>';
        renderAll(); persist();
      });
      if (act === 'lib') b.addEventListener('click', function () {
        var lb = $('.lib', slot);
        if (!lb) return;
        lb.classList.toggle('open');
        if (lb.classList.contains('open') && !lb.dataset.filled) { fillLib(lb, path, slot); lb.dataset.filled = '1'; }
      });
    });
  });
  /* 数组操作：上移 / 下移 / 删除 / 新增 */
  $$('[data-add]', body).forEach(function (b) {
    b.addEventListener('click', function () { addAt(b.dataset.add); });
  });
  $$('[data-act="del"]', body).forEach(function (b) {
    if (b.dataset.tgt) {
      b.addEventListener('click', function () { delAt(b.dataset.tgt, +b.dataset.i); });
    }
  });
  $$('.grp-tools [data-act]', body).forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      var g = b.closest('.grp'), body2 = g.parentNode;
      var listPath = listPathOf(g);
      if (!listPath) return;
      var arr = get(listPath); if (!Array.isArray(arr)) return;
      /* 序号必须在该数组自己的同级卡片中计算，不能用分页内全部卡片的位置 */
      var siblings = $$('.grp', body2).filter(function (x) { return listPathOf(x) === listPath; });
      var idx = siblings.indexOf(g);
      var i = idx;
      if (b.dataset.act === 'del') { arr.splice(i, 1); }
      else if (b.dataset.act === 'up-i' && i > 0) { arr.splice(i - 1, 0, arr.splice(i, 1)[0]); }
      else if (b.dataset.act === 'dn-i' && i < arr.length - 1) { arr.splice(i + 1, 0, arr.splice(i, 1)[0]); }
      else return;
      renderAll(); persist(); buildEditor(edTab);
    });
  });
}
/* 分页默认列表：仅当卡片内无法反推出所属数组时作为兜底 */
var CURRENT_LIST = {
  brand: 'nav.items', hero: 'hero.slides', vision: 'about.paragraphs',
  credo: 'credo.items', careers: 'careers.cards', benefits: 'benefits.groups',
  news: 'news.items', footer: 'footer.columns'
};
/* 卡片所属数组：从卡片内输入框的 data-p 反推最长数组前缀。
   不能按分页统一取列表，因为同一分页可能并列多类卡片（如段落/数字/时间线），
   否则会误删同分页其他类型的条目 */
function listPathOf(g) {
  var ps = $$('[data-p]', g).map(function (el) { return el.dataset.p; });
  var best = '';
  ps.forEach(function (p) {
    var parts = p.split('.');
    for (var n = parts.length - 1; n >= 1; n--) {
      var cand = parts.slice(0, n).join('.');
      if (cand.length <= best.length) continue;
      if (Array.isArray(get(cand))) best = cand;
    }
  });
  if (best) return best;
  return CURRENT_LIST[edTab] || null;
}
function addAt(path) {
  var arr = get(path);
  if (!Array.isArray(arr)) return;
  var last = arr[arr.length - 1];
  var blank;
  if (path === 'nav.langs' || path === 'vision.lines' || path === 'about.paragraphs') blank = '';
  else if (/points$|items$/.test(path) && last && typeof last === 'string') blank = '';
  else if (path === 'nav.items') blank = { label: '新菜单', anchor: '#top' };
  else if (path === 'hero.slides') blank = { id: 's' + Date.now(), name: '新角色', enName: 'NEW CHARACTER', tagline: '作品 · 标签', desc: '在这里填写一句话介绍。', linkText: '在 B 站观看', linkUrl: '#', image: (LIB[0] || {}).url || '', video: '', socials: [{ label: '微博', url: '#' }] };
  else if (path === 'hero.slides.' + path.split('.')[2] + '.socials') blank = { label: '新平台', url: '#' };
  else if (/socials$/.test(path)) blank = { label: '新平台', url: '#' };
  else if (path === 'about.facts') blank = { num: 100, unit: '+', label: '新数据' };
  else if (path === 'history.timeline') blank = { year: '2026', text: '在这里填写这一年的关键事件。' };
  else if (path === 'credo.items') blank = { en: 'Something New', zh: '新理念', desc: '在这里填写说明。' };
  else if (path === 'values.items') blank = { zh: '新关键词', en: 'New Key' };
  else if (path === 'careers.cards') blank = { title: '新入口', desc: '在这里填写说明。', linkText: 'MORE INFORMATION', linkUrl: '#', image: (LIB[0] || {}).url || '' };
  else if (path === 'history.pillars') blank = { title: '新要点组', points: ['要点一'] };
  else if (path === 'benefits.groups') blank = { title: '新看点', subtitle: '副标题', items: ['条目一'] };
  else if (path === 'news.items') blank = { id: 'n' + Date.now(), mmdd: '01/01', year: '2026', cat: '角色动态', title: '视频标题', excerpt: '在这里填写摘要。', image: (LIB[0] || {}).url || '', linkUrl: '#' };
  else if (path === 'footer.columns') blank = { title: '新栏目', links: [{ label: '链接', url: '#' }] };
  else if (/links$/.test(path)) blank = { label: '新链接', url: '#' };
  else blank = last ? deep(last) : {};
  arr.push(blank);
  renderAll(); persist(); buildEditor(edTab);
}
function delAt(path, i) {
  var arr = get(path);
  if (!Array.isArray(arr)) return;
  arr.splice(i, 1); renderAll(); persist(); buildEditor(edTab);
}
function fillLib(lb, path, slot) {
  var cats = [];
  LIB.forEach(function (x) { if (cats.indexOf(x.cat) < 0) cats.push(x.cat); });
  var cur = null;
  function paint(cat) {
    cur = cat;
    $$('.lib-cats button', lb).forEach(function (b) { b.classList.toggle('on', b.dataset.c === cat); });
    $('.lib-grid', lb).innerHTML = LIB.filter(function (x) { return x.cat === cat; }).map(function (x) {
      return '<button type="button" data-u="' + esc(x.url) + '" title="' + esc(x.label) + '"><img src="' + esc(x.url) + '" alt="' + esc(x.label) + '" loading="lazy"></button>';
    }).join('');
    $$('.lib-grid button', lb).forEach(function (b) {
      b.addEventListener('click', function () {
        set(path, b.dataset.u);
        var inp = $('input[type=text]', slot); if (inp) inp.value = b.dataset.u;
        $('.prev', slot).innerHTML = '<img src="' + esc(b.dataset.u) + '" alt="预览" loading="lazy">';
        renderAll(); persist(); toast('已选用图库图片');
      });
    });
  }
  $('.lib-cats', lb).innerHTML = cats.map(function (c) {
    return '<button type="button" data-c="' + esc(c) + '">' + esc(c) + '</button>';
  }).join('');
  $$('.lib-cats button', lb).forEach(function (b) {
    b.addEventListener('click', function () { paint(b.dataset.c); });
  });
  if (cats.length) paint(cats[0]);
}
function pickFile(path, slot) {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.addEventListener('change', function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    if (f.size > 3 * 1024 * 1024) { toast('图片超过 3MB，建议压缩后再上传或改用图片网址'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      set(path, fr.result);
      var i2 = $('input[type=text]', slot); if (i2) i2.value = '(本地上传的图片)';
      $('.prev', slot).innerHTML = '<img src="' + fr.result + '" alt="预览">';
      renderAll(); persist(); toast('已使用本地图片');
    };
    fr.readAsDataURL(f);
  });
  inp.click();
}

function openEditor() { edOpen = true; $('#edPanel').classList.add('open'); $('#edMask').classList.add('open'); buildEditor(edTab); }
function closeEditor() { edOpen = false; $('#edPanel').classList.remove('open'); $('#edMask').classList.remove('open'); }

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
</body>
</html>
